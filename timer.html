<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сколько мы вместе? ❤️</title>
<link rel="stylesheet" href="timer.css">
</head>
<body>
<main class="timer-page">
<h1>Сколько мы вместе? ❤️</h1>
<p class="subtitle">Наша история длится уже</p>

<section class="counter">
<div><span id="years">0</span><small>лет</small></div>
<div><span id="days">0</span><small>дней</small></div>
<div><span id="hours">0</span><small>часов</small></div>
<div><span id="minutes">0</span><small>минут</small></div>
<div><span id="seconds">0</span><small>секунд</small></div>
</section>

<section class="date-card">
<h2>Мы вместе с ❤️</h2>
<p>Дата начала нашей истории</p>
</section>

<section class="quote">
<p>Каждая секунда рядом с тобой — это самое ценное, что у меня есть.<br>Спасибо, что ты есть в моей жизни ❤️</p>
</section>

<p class="love">люблю тебя ♡</p>
</main>
<script src="timer.js"></script>
</body>
</html>
