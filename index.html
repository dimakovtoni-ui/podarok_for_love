<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Для тебя ❤️</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="hero">
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <section class="intro-card" aria-labelledby="intro-title">
      <p class="eyebrow reveal reveal-1">маленький сюрприз</p>
      <h1 id="intro-title" class="reveal reveal-2">Привет, любимая <span aria-hidden="true">❤️</span></h1>
      <p class="lead reveal reveal-3">
        У меня для тебя кое-что есть.
      </p>
      <p class="text reveal reveal-4">
        Я хотел собрать в одном месте маленькую часть нашей истории —
        наши моменты, воспоминания и всё то, что иногда сложно сказать словами.
      </p>

      <button class="open-button reveal reveal-5" id="openStory" type="button">
        <span>Открыть нашу историю</span>
        <span class="arrow" aria-hidden="true">→</span>
      </button>
    </section>

    <p class="signature reveal reveal-6">made with <span aria-hidden="true">♥</span> for you</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
